    <text x="72" y="88">PYTHON</text><text x="187" y="88">STATISTICS</text><text x="302" y="88">SQL</text><text x="417" y="88">DATA</text>
    <text x="417" y="105">ANALYTICS</text><text x="532" y="88">MACHINE</text><text x="532" y="105">LEARNING</text>
    <text x="647" y="88">DEEP</text><text x="647" y="105">LEARNING</text><text x="762" y="88">NLP / LLM</text>
    <text x="902" y="88">ML ENGINEERING</text><text x="902" y="105">→ RESEARCH</text>
  </g>
  <g fill="#94a3b8" font-size="10">
    <text x="72" y="118">foundation</text><text x="187" y="118">reasoning</text><text x="302" y="118">data</text><text x="532" y="118">models</text>
