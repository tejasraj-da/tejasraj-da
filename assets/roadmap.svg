<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
<title id="title">Tejas Raj learning roadmap</title>
<desc id="desc">Roadmap from Python and statistics through machine learning, deep learning, LLMs, ML engineering and research.</desc>
<defs>
