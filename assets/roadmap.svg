  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#151b30"/></linearGradient>
</defs>
<rect width="1000" height="190" rx="20" fill="#070b16"/>
<path d="M75 95H925" stroke="url(#line)" stroke-width="4" opacity=".7"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <g fill="url(#box)" stroke="#334155">
    <rect x="25" y="62" width="95" height="66" rx="12"/><rect x="140" y="62" width="95" height="66" rx="12"/>
    <rect x="255" y="62" width="95" height="66" rx="12"/><rect x="370" y="62" width="95" height="66" rx="12"/>
    <rect x="485" y="62" width="95" height="66" rx="12"/><rect x="600" y="62" width="95" height="66" rx="12"/>
    <rect x="715" y="62" width="95" height="66" rx="12"/><rect x="830" y="62" width="145" height="66" rx="12"/>
  </g>
