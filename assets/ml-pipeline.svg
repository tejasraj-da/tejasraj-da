<rect width="1100" height="190" rx="20" fill="#070b16"/>
<path d="M95 95H1005" stroke="url(#a)" stroke-width="3" opacity=".65"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <g fill="#0b1020" stroke="#334155">
    <rect x="25" y="55" width="125" height="80" rx="14"/><rect x="175" y="55" width="125" height="80" rx="14"/>
    <rect x="325" y="55" width="125" height="80" rx="14"/><rect x="475" y="55" width="125" height="80" rx="14"/>
    <rect x="625" y="55" width="125" height="80" rx="14"/><rect x="775" y="55" width="125" height="80" rx="14"/>
    <rect x="925" y="55" width="150" height="80" rx="14"/>
  </g>
